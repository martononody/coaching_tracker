<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦅 Coaching Tracker — H1 2026 · Forza Lazio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f5fc;--surface:#ffffff;--surface2:#e8f0fa;--border:#ccd9ee;--border2:#b0c4e0;
  --text:#0d1f3c;--text2:#2c4a7c;--text3:#7a90b0;
  --green-bg:#ebfbee;--green-t:#2b8a3e;
  --amber-bg:#fff9db;--amber-t:#e67700;
  --red-bg:#fff0f0;--red-t:#c92a2a;
  --blue:#1B3A6B;--blue-bg:#ddeaff;--blue-t:#1B3A6B;
  --lazio-sky:#6EADE8;--lazio-dark:#1B3A6B;--lazio-gold:#C8A84B;
  --r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a1628;--surface:#0f2040;--surface2:#152b55;--border:#1e3a6e;--border2:#2a4f8a;
  --text:#e8f0ff;--text2:#a0bde8;--text3:#6080a8;
  --green-bg:#1a2e1a;--green-t:#51cf66;
  --amber-bg:#2e2600;--amber-t:#ffd43b;
  --red-bg:#2e1a1a;--red-t:#ff6b6b;
  --blue:#6EADE8;--blue-bg:#0f2040;--blue-t:#6EADE8;
  --lazio-sky:#6EADE8;--lazio-dark:#0a1628;--lazio-gold:#C8A84B;
}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:600}
.logo span{color:var(--text3);font-weight:400;font-size:13px;margin-left:8px}
.updated{font-size:11px;color:var(--text3)}
.tabs{background:#1B3A6B;border-bottom:2px solid #C8A84B;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab-btn{padding:10px 16px;border:none;background:none;cursor:pointer;font-size:13px;color:#a0bde8;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;font-family:inherit;margin-bottom:-2px}
.tab-btn:hover{color:#ffffff;background:rgba(110,173,232,0.15)}
.tab-btn.on{color:#ffffff;border-bottom-color:#C8A84B;font-weight:600;background:rgba(110,173,232,0.1)}
.panel{display:none;padding:20px;max-width:1100px;margin:0 auto}
.panel.on{display:block}
/* week nav */
.wnav{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl)}
.wnav-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:5px 14px;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit;transition:all 0.1s}
.wnav-btn:hover:not(:disabled){background:var(--border2)}
.wnav-btn:disabled{opacity:0.3;cursor:not-allowed}
.wnav-label{font-size:14px;font-weight:600;flex:1;text-align:center}
.wnav-count{font-size:11px;color:var(--text3)}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;cursor:pointer;transition:all 0.15s}
.card:hover{border-color:#6EADE8;box-shadow:0 4px 16px rgba(110,173,232,0.25);transform:translateY(-1px)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.av-nj{background:#ebfbee;color:#2b8a3e}
.av-pp{background:#e7f5ff;color:#1971c2}
.av-ns{background:#fff9db;color:#e67700}
.av-lv{background:#f8f0fc;color:#862e9c}
.av-end{background:var(--surface2);color:var(--text3)}
.card-name{font-size:14px;font-weight:600}
.card-cat{font-size:10px;color:var(--text3);margin-top:1px}
.status-dot{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;white-space:nowrap}
.s-g{background:var(--green-bg);color:var(--green-t)}
.s-a{background:var(--amber-bg);color:var(--amber-t)}
.s-r{background:var(--red-bg);color:var(--red-t)}
.s-x{background:var(--surface2);color:var(--text3)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.kpi{border-radius:6px;padding:6px 5px;text-align:center}
.kpi-l{font-size:9px;opacity:0.75;margin-bottom:2px;font-weight:500}
.kpi-v{font-size:13px;font-weight:600}
.kg{background:var(--green-bg);color:var(--green-t)}
.ka{background:var(--amber-bg);color:var(--amber-t)}
.kr{background:var(--red-bg);color:var(--red-t)}
.kn{background:var(--surface2);color:var(--text3)}
.obs-line{font-size:11px;color:var(--blue-t);background:var(--blue-bg);border-radius:6px;padding:6px 8px;border-left:3px solid #C8A84B}
.click-hint{font-size:10px;color:var(--text3);text-align:right;margin-top:8px}
.traj{font-size:11px;font-weight:500;margin-bottom:6px}
.tup{color:var(--green-t)}.tdn{color:var(--red-t)}.tfl{color:var(--text3)}
.no-data-card{text-align:center;padding:20px;color:var(--text3);font-size:12px;font-style:italic}
/* people tab */
.people-list{display:flex;flex-direction:column;gap:8px}
.person-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s}
.person-row:hover{border-color:#6EADE8;box-shadow:0 4px 16px rgba(110,173,232,0.2)}
.person-row-info{flex:1}
.person-row-name{font-size:14px;font-weight:600}
.person-row-cat{font-size:11px;color:var(--text3);margin-top:2px}
.person-row-latest{font-size:12px;color:var(--text2);margin-top:4px}
.person-row-arrow{font-size:18px;color:var(--text3)}
/* individual person view */
.person-view{display:none}
.person-view.on{display:block}
.back-btn{background:none;border:1px solid var(--border2);border-radius:var(--r);padding:6px 14px;cursor:pointer;font-size:12px;color:var(--text2);font-family:inherit;margin-bottom:16px;display:flex;align-items:center;gap:6px;transition:all 0.1s}
.back-btn:hover{background:var(--surface2);color:var(--text)}
.person-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
.person-hero-info{flex:1}
.person-hero-name{font-size:20px;font-weight:700}
.person-hero-cat{font-size:12px;color:var(--text3);margin-top:3px}
.person-hero-profile{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5;font-style:italic;max-width:600px}
.person-av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.kpi-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.kpi-sum-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 8px;text-align:center}
.kpi-sum-label{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:500}
.kpi-sum-val{font-size:16px;font-weight:700}
.kpi-sum-sub{font-size:10px;color:var(--text3);margin-top:2px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.chart-wrap{position:relative;height:220px}
.kpi-tabs{display:flex;gap:4px;flex-wrap:wrap}
.kpi-tab{padding:4px 10px;border:1px solid var(--border2);border-radius:20px;font-size:11px;cursor:pointer;background:var(--surface2);color:var(--text3);font-family:inherit;transition:all 0.1s}
.kpi-tab.on{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue)}
.stats-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:16px}
.stats-title{font-size:13px;font-weight:600;margin-bottom:12px}
.stats-table{width:100%;border-collapse:collapse;font-size:12px}
.stats-table th{padding:6px 10px;text-align:center;font-weight:500;color:var(--text3);border-bottom:1px solid var(--border);font-size:10px}
.stats-table th:first-child{text-align:left}
.stats-table td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:center}
.stats-table td:first-child{text-align:left;font-weight:500;color:var(--text2)}
.stats-table tbody tr:hover td{background:var(--surface2)}
.chip{border-radius:4px;padding:2px 7px;display:inline-block;font-size:11px;font-weight:500}
.cg{background:var(--green-bg);color:var(--green-t)}
.ca{background:var(--amber-bg);color:var(--amber-t)}
.cr{background:var(--red-bg);color:var(--red-t)}
.cn{background:var(--surface2);color:var(--text3)}
/* trends */
.trend-controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.trend-title-main{font-size:14px;font-weight:600}
.kpi-btns{display:flex;gap:5px;flex-wrap:wrap}
.kpi-btn{padding:5px 12px;border:1px solid var(--border2);border-radius:20px;font-size:11px;cursor:pointer;background:var(--surface);color:var(--text3);font-family:inherit;transition:all 0.1s}
.kpi-btn:hover{border-color:var(--blue);color:var(--blue)}
.kpi-btn.on{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text3);margin-top:10px}
.leg-i{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* notes */
.notes-person{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:10px}
.note-ph{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background 0.1s;user-select:none}
.note-ph:hover{background:var(--surface2)}
.note-ph-name{font-size:13px;font-weight:600;flex:1}
.note-ph-cat{font-size:10px;color:var(--text3)}
.note-weeks{display:none}
.note-weeks.open{display:block}
.note-week{border-top:1px solid var(--border)}
.note-wlabel{font-size:11px;font-weight:500;color:var(--text3);padding:7px 14px;background:var(--surface2);display:flex;align-items:center;gap:6px;cursor:pointer}
.note-wlabel:hover{background:var(--border)}
.note-body{display:none;padding:10px 14px;border-top:1px solid var(--border)}
.note-body.open{display:block}
.note-obs{font-size:11px;color:var(--text2);margin-bottom:8px;white-space:pre-line;line-height:1.6;background:var(--surface2);padding:8px 10px;border-radius:6px}
.note-yours{background:#f0fff4;border:1px solid #b2f2bb;border-radius:6px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start}
@media(prefers-color-scheme:dark){.note-yours{background:#1a2e1a;border-color:#2f9e44}}
.note-yours-lbl{font-size:10px;color:var(--green-t);font-weight:600;padding-top:3px;white-space:nowrap;min-width:55px}
.note-yours textarea{flex:1;border:none;background:transparent;font-size:11px;color:var(--text);resize:vertical;min-height:36px;font-family:inherit;outline:none;line-height:1.5}
.saved-flash{font-size:9px;color:var(--text3);opacity:0;transition:opacity 0.3s;align-self:flex-end;margin-bottom:2px}
.saved-flash.show{opacity:1}
/* alerts */
.alert-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px}
.alert-name{font-size:13px;font-weight:600;margin-bottom:8px}
.alert-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.alert-row:last-child{border-bottom:none}
.al{padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600}
.al-r{background:var(--red-bg);color:var(--red-t)}
.al-a{background:var(--amber-bg);color:var(--amber-t)}
.al-f{background:var(--blue-bg);color:var(--blue-t)}
.section-intro{font-size:12px;color:var(--text3);margin-bottom:14px;padding:8px 12px;background:var(--surface2);border-radius:var(--r);border-left:3px solid #C8A84B}
</style>
</head>
<body>
<div class="topbar" style="background:linear-gradient(135deg,#1B3A6B 0%,#0d2347 60%,#1B3A6B 100%);border-bottom:3px solid #C8A84B">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="font-size:22px">⚽</div>
    <div>
      <div class="logo" style="color:#ffffff;font-size:15px;font-weight:700;letter-spacing:0.3px">Coaching Tracker <span style="color:#6EADE8;font-weight:400;font-size:13px">H1 2026 · Marshmallow</span></div>
      <div style="font-size:10px;color:#C8A84B;font-weight:500;letter-spacing:1px">FORZA LAZIO 🦅</div>
    </div>
  </div>
  <div class="updated" style="color:#a0bde8">Updated 31 Jul 2026</div>
</div>
<div class="tabs">
  <button class="tab-btn on" onclick="showTab('dash',this)">Dashboard</button>
  <button class="tab-btn" onclick="showTab('people',this)">People</button>
  <button class="tab-btn" onclick="showTab('trends',this)">Trends</button>
  <button class="tab-btn" onclick="showTab('monthly',this)">Monthly</button>
  <button class="tab-btn" onclick="showTab('notes',this)">Notes</button>
  <button class="tab-btn" onclick="showTab('alerts',this)">Alerts</button>
</div>
<div id="tab-dash" class="panel on"></div>
<div id="tab-people" class="panel"></div>
<div id="tab-trends" class="panel"></div>
<div id="tab-monthly" class="panel"></div>
<div id="tab-notes" class="panel"></div>
<div id="tab-alerts" class="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const COLORS={Blanka:"#2a78d6",Alexa:"#1baf7a",Moni:"#eda100",Lili:"#e87ba4",Vincent:"#868e96"};
const PP={cph:[3.6,4.0],iqs:[0.85,0.90],td:[0.90,0.95],csat:[0.72,0.80],iadh:[0.90,0.95]};
const NJ3={cph:[3.2,3.6],iqs:[0.80,0.85],td:[0.90,0.95],csat:[0.70,0.75],iadh:[0.90,0.95]};
const NJ2={cph:[2.0,2.5],iqs:[0.75,0.80],td:[0.85,0.90],csat:[0.65,0.70],iadh:[0.85,0.90]};
const KPIS={
  cph:{label:"CPH",fmt:v=>v.toFixed(2),fl:3.6,tg:4.0},
  iqs:{label:"IQS",fmt:v=>(v*100).toFixed(0)+"%",fl:0.85,tg:0.90},
  td:{label:"TD adh",fmt:v=>(v*100).toFixed(0)+"%",fl:0.90,tg:0.95},
  csat:{label:"CSAT",fmt:v=>(v*100).toFixed(0)+"%",fl:0.72,tg:0.80},
  iadh:{label:"Int adh",fmt:v=>(v*100).toFixed(0)+"%",fl:0.90,tg:0.95},
};

const C={
  Blanka:{cat:"New Joiner",av:"nj",start:"2026-05-05",active:true,
    profile:"New joiner from 5 May 2026. Month 3 thresholds from 5 Jul. IQS consistently above target. TD adherence exceptional throughout. CPH hit 4.0 w/c 21 Jul. Intercom adherence the only persistent gap.",
    weeks:[
      {w:"2026-05-25",cph:6.86,iqs:null,td:0.00,csat:1.00,iadh:0.9325,obs:"CPH 6.86 — 100% commercial chats (TD 0% was setup issue, resolved)\nCSAT 100% — strong\nIntercom 93% — on track"},
      {w:"2026-06-01",cph:2.16,iqs:null,td:0.9421,csat:0.944,iadh:0.7412,obs:"CPH 2.16 — 62% commercial chats\nTD 94% — strong\nCSAT 94% — strong\nIntercom 74% — below floor"},
      {w:"2026-06-08",cph:2.13,iqs:null,td:0.9708,csat:0.938,iadh:0.7369,obs:"CPH 2.13 — low commercial mix so not complexity\nTD 97% — strong\nCSAT 94% — strong\nIntercom 74% — below floor"},
      {w:"2026-06-15",cph:2.62,iqs:null,td:0.9645,csat:0.700,iadh:0.7325,obs:"CPH 2.62\nTD 96% — strong\nCSAT 70% — below floor\nIntercom 73% — below floor",yours:"she is doing well, her relevant experience shows and once she get more comfortable with the processes, she will have no problems"},
      {w:"2026-06-29",cph:2.538,iqs:0.9307,td:0.9747,csat:0.6527,iadh:0.7874,obs:"CPH 2.54 — 141 assigned, 102 closed (28% carrying over)\nIQS 93% — solid\nTD 97% — strong\nCSAT 65% — below floor\nIntercom 79% — below floor"},
      {w:"2026-07-07",cph:3.47,iqs:0.899,td:0.9678,csat:0.722,iadh:0.7648,obs:"CPH 3.47 — partial week\nIQS 90% — solid\nTD 97% — strong\nCSAT 72% — within range\nIntercom 76% — below floor"},
      {w:"2026-07-14",cph:3.37,iqs:0.915,td:0.9766,csat:0.857,iadh:0.7414,obs:"CPH 3.37\nIQS 92% — solid\nTD 98% — strong\nCSAT 86% — within range\nIntercom 74% — below floor"},
      {w:"2026-07-21",cph:4.00,iqs:null,td:0.9930,csat:null,iadh:0.8050,obs:"CPH 4.00 — AT POST-PROBATION TARGET. Best week yet.\nTD 99% — exceptional\nIntercom 81% — below floor"},
      {w:"2026-07-28",cph:3.11,iqs:0.967,td:0.9834,csat:null,iadh:0.7949,obs:"CPH 3.11 — above NJ3 floor\nIQS 97% — excellent ✓\nTD 98% — strong ✓\nIntercom 79% — below floor"},
    ]},
  Alexa:{cat:"Post-Probation",av:"pp",start:"2025-06-01",active:true,
    profile:"Post-probation, passed to Marci ~Jun 2026. CPH slid from 3.63 to 2.64 then recovered strongly after shadow session 10 Jul. CPH 3.89 w/c 28 Jul — best week. Shadow themes: messages too long, not snoozing, overthinking.",
    weeks:[
      {w:"2026-05-04",cph:3.63,iqs:1.000,td:0.9842,csat:1.00,iadh:0.8171,obs:"CPH 3.63 — just above floor\nIQS 100% — excellent\nCSAT 100% — strong\nIntercom 82% — below floor"},
      {w:"2026-05-11",cph:2.89,iqs:0.980,td:0.9898,csat:0.600,iadh:0.8348,obs:"CPH 2.89 — dropped 0.74\nIQS 98% — excellent\nCSAT 60% — below floor\nIntercom 83% — below floor"},
      {w:"2026-05-18",cph:3.06,iqs:null,td:0.9914,csat:0.789,iadh:0.7777,obs:"CPH 3.06\nTD 99% — strong\nCSAT 79% — within range\nIntercom 78% — below floor"},
      {w:"2026-05-25",cph:3.24,iqs:1.000,td:0.9936,csat:1.00,iadh:0.7621,obs:"CPH 3.24\nIQS 100% — excellent\nCSAT 100% — strong\nIntercom 76% — below floor"},
      {w:"2026-06-01",cph:2.99,iqs:0.837,td:0.9876,csat:0.909,iadh:0.7238,obs:"CPH 2.99\nIQS 84% — below floor\nCSAT 91% — strong\nIntercom 72% — below floor"},
      {w:"2026-06-08",cph:3.07,iqs:null,td:0.9650,csat:0.800,iadh:0.8031,obs:"CPH 3.07\nTD 97% — strong\nCSAT 80% — within range\nIntercom 80% — below floor"},
      {w:"2026-06-15",cph:2.64,iqs:1.000,td:0.9755,csat:0.889,iadh:0.7493,obs:"CPH 2.64 — sliding since May\nIQS 100% — quality still excellent\nIntercom 75% — below floor",yours:"she wants to do well, prepared for meetings, but stg is missing from her pace, IQs is always great, along with TD, so she is really focused we just have to do stg with the cph"},
      {w:"2026-06-29",cph:2.215,iqs:0.9405,td:0.9875,csat:0.600,iadh:0.7833,obs:"⚠️ Holiday week — 2 days only. Disregard for trends."},
      {w:"2026-07-07",cph:2.92,iqs:null,td:0.9875,csat:0.8666,iadh:0.8343,obs:"CPH 2.92 — partial week\nShadow session done",yours:"🔍 Shadow session — 10 Jul 2026\n• Nice phrasing and attention to detail — genuine strength, but it's costing her time\n• Messages too long — can be polite and helpful in fewer words\n• Not snoozing idle chats — snooze after 5 mins if nothing's happening\n• Asking for 10 mins too automatically without reading the thread first\n• Same overthinking pattern as Moni\n• Key action: shorter messages, snooze discipline, read the full thread before committing"},
      {w:"2026-07-14",cph:3.58,iqs:0.800,td:0.9872,csat:0.806,iadh:0.8529,obs:"CPH 3.58 — up 0.66, shadow coaching working\nIQS 80% — right on floor\nIntercom 85% — best yet"},
      {w:"2026-07-21",cph:3.17,iqs:1.000,td:0.9880,csat:null,iadh:0.8404,obs:"CPH 3.17 — slight dip from 3.58\nIQS 100% — bounced back\nIntercom 84% — still improving"},

const allWeeks=[...new Set(Object.values(C).flatMap(c=>c.weeks.map(w=>w.w)))].sort();
let weekIdx=allWeeks.length-1;
let trendKpi="cph";
let trendChart=null;

let prevTab=null;

function thresh(name,week){
  const c=C[name];
  if(!c.active||c.cat==="Low Volume")return null;
  if(c.cat==="New Joiner"){
    const s=new Date(c.start),w=new Date(week);
    const m=(w.getFullYear()-s.getFullYear())*12+(w.getMonth()-s.getMonth());
    return m<=1?NJ2:NJ3;
  }
  return PP;
}
function rag(v,fl,tg){if(v===null||v===undefined)return null;if(v>=tg)return"G";if(v>=fl)return"A";return"R";}
function kCls(r){return r==="G"?"kg":r==="A"?"ka":r==="R"?"kr":"kn";}
function chipCls(r){return r==="G"?"cg":r==="A"?"ca":r==="R"?"cr":"cn";}
function fmtCph(v){return v!==null?v.toFixed(2):"—";}
function fmtPct(v){return v!==null?(v*100).toFixed(0)+"%":"—";}
function arr(cur,prev){
  if(cur===null||prev===null)return"";
  const d=cur-prev;
  if(d>0.15)return' <span style="color:var(--green-t)">↑</span>';
  if(d<-0.15)return' <span style="color:var(--red-t)">↓</span>';
  return' <span style="color:var(--text3)">→</span>';
}
function trend4(vals){
  const c=vals.filter(v=>v!==null);
  if(c.length<3)return 0;
  const r=(c[c.length-1]+(c[c.length-2]||c[c.length-1]))/2;
  const e=c.length>=4?(c[c.length-3]+c[c.length-4])/2:c[0];
  return r-e;
}
function getTraj(name,week){
  const rows=C[name].weeks.filter(w=>w.w<=week);
  const cd=trend4(rows.map(w=>w.cph)),td=trend4(rows.map(w=>w.td)),sd=trend4(rows.map(w=>w.csat));
  const pos=[cd,td,sd].filter(d=>d>0.05).length,neg=[cd,td,sd].filter(d=>d<-0.05).length;
  if(pos>=2)return{label:"Improving",cls:"tup",icon:"📈"};
  if(neg>=2)return{label:"Declining",cls:"tdn",icon:"📉"};
  return{label:"Stable",cls:"tfl",icon:"➡"};
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function renderCard(name,week){
  const c=C[name];
  const wd=c.weeks.find(w=>w.w===week);
  const prevWks=c.weeks.filter(w=>w.w<week);
  const prev=prevWks.length?prevWks[prevWks.length-1]:null;
  const t=thresh(name,week);
  if(!wd)return`<div class="card" onclick="openPerson('${name}')"><div class="card-header"><div class="av av-${c.av}">${name[0]}</div><div><div class="card-name">${name}</div><div class="card-cat">${c.cat}</div></div></div><div class="no-data-card">no data this week</div><div class="click-hint">click to view →</div></div>`;
  const kpiDef=[
    {k:"cph",label:"CPH",fmt:fmtCph,t:t?.cph},
    {k:"iqs",label:"IQS",fmt:fmtPct,t:t?.iqs},
    {k:"td",label:"TD",fmt:fmtPct,t:t?.td},
    {k:"csat",label:"CSAT",fmt:fmtPct,t:t?.csat},
    {k:"iadh",label:"IntAdh",fmt:fmtPct,t:t?.iadh},
  ];
  const rags=t?kpiDef.map(k=>rag(wd[k.k],k.t?.[0],k.t?.[1])).filter(r=>r):[];
  const reds=rags.filter(r=>r==="R").length;
  let sc,ss;
  if(!t){sc="s-x";ss="monitoring";}
  else if(reds>=2){sc="s-r";ss="needs attention";}
  else if(reds===1){sc="s-a";ss="monitor";}
  else{sc="s-g";ss="on track";}
  const tr=c.active?getTraj(name,week):null;
  const firstLine=wd.obs?wd.obs.split("\n")[0]:"";
  return`<div class="card" onclick="openPerson('${name}')">
    <div class="card-header">
      <div class="av av-${c.av}">${name[0]}</div>
      <div><div class="card-name">${name}</div><div class="card-cat">${c.cat}</div></div>
      <span class="status-dot ${sc}">${ss}</span>
    </div>
    <div class="kpis">${kpiDef.map(k=>{
      const r=t?rag(wd[k.k],k.t?.[0],k.t?.[1]):null;
      return`<div class="kpi ${kCls(r)}"><div class="kpi-l">${k.label}</div><div class="kpi-v">${k.fmt(wd[k.k])}${arr(wd[k.k],prev?.[k.k])}</div></div>`;
    }).join("")}</div>
    ${tr?`<div class="traj ${tr.cls}">${tr.icon} ${tr.label}</div>`:""}
    ${firstLine?`<div class="obs-line">${firstLine}</div>`:""}
    <div class="click-hint">click to view full profile →</div>
  </div>`;
}

// ── Person view ───────────────────────────────────────────────────────────────
function openPerson(name,fromTab){
  currentPerson=name;
  prevTab=fromTab||"dash";
  const c=C[name];
  const latest=c.weeks[c.weeks.length-1];
  const t=thresh(name,latest.w);

  // Build person panel HTML
  const kpiDef=[
    {k:"cph",label:"CPH",fmt:fmtCph,t:t?.cph,fl:"3.6",tg:"4.0"},
    {k:"iqs",label:"IQS",fmt:fmtPct,t:t?.iqs,fl:"85%",tg:"90%"},
    {k:"td",label:"TD adh",fmt:fmtPct,t:t?.td,fl:"90%",tg:"95%"},
    {k:"csat",label:"CSAT",fmt:fmtPct,t:t?.csat,fl:"72%",tg:"80%"},
    {k:"iadh",label:"Int adh",fmt:fmtPct,t:t?.iadh,fl:"90%",tg:"95%"},
  ];

  // latest week summary
  const summaryHTML=kpiDef.map(k=>{
    const v=latest[k.k];
    const r=t?rag(v,k.t?.[0],k.t?.[1]):null;
    return`<div class="kpi-sum-cell ${kCls(r)}">
      <div class="kpi-sum-label">${k.label}</div>
      <div class="kpi-sum-val">${k.fmt(v)}</div>
      <div class="kpi-sum-sub">fl ${k.fl} · tg ${k.tg}</div>
    </div>`;
  }).join("");

  // weekly stats table
  const tableRows=c.weeks.slice().reverse().map(w=>{
    const tw=thresh(name,w.w);
    function cell(v,key){
      const rv=tw?rag(v,tw[key][0],tw[key][1]):null;
      const val=key==="cph"?fmtCph(v):fmtPct(v);
      return`<td><span class="chip ${chipCls(rv)}">${v!==null?val:"—"}</span></td>`;
    }
    const isLatest=w.w===latest.w;
    return`<tr style="${isLatest?"font-weight:600":""}">
      <td>${w.w}${isLatest?' <span style="font-size:9px;color:var(--blue-t)">latest</span>':""}</td>
      ${cell(w.cph,"cph")}${cell(w.iqs,"iqs")}${cell(w.td,"td")}${cell(w.csat,"csat")}${cell(w.iadh,"iadh")}
    </tr>`;
  }).join("");

  const kpiTabsHTML=Object.entries(KPIS).map(([k,v])=>`<button class="kpi-tab${k===personKpi?" on":""}" onclick="setPersonKpi('${k}')">${v.label}</button>`).join("");

  const panelEl=document.getElementById("tab-people");
  panelEl.innerHTML=`
    <button class="back-btn" onclick="closePerson()">← back</button>
    <div class="person-hero" style="border-left:4px solid #C8A84B">
      <div class="av person-av av-${c.av}">${name[0]}</div>
      <div class="person-hero-info">
        <div class="person-hero-name">${name}</div>
        <div class="person-hero-cat">${c.cat} · Started ${c.start}</div>
        <div class="person-hero-profile">${c.profile}</div>
      </div>
    </div>
    <div class="kpi-summary">${summaryHTML}</div>
    <div class="chart-card">
      <div class="chart-title">
        <span>KPI Trend</span>
        <div class="kpi-tabs">${kpiTabsHTML}</div>
      </div>
      <div class="chart-wrap"><canvas id="personChart" role="img" aria-label="Trend chart for ${name}"></canvas></div>
    </div>
    <div class="stats-card">
      <div class="stats-title">🦅 All weeks — ${name}</div>
      <table class="stats-table">
        <thead><tr><th>Week</th><th>CPH</th><th>IQS</th><th>TD adh</th><th>CSAT</th><th>Int adh</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;

  // Show people tab
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("on"));
  panelEl.classList.add("on");
  document.querySelectorAll(".tab-btn")[1].classList.add("on");

  buildPersonChart(name);
}
window.openPerson=openPerson;

function buildPersonChart(name){
  if(personChart){personChart.destroy();personChart=null;}
  const c=C[name];
  const kpi=KPIS[personKpi];
  const isDark=matchMedia("(prefers-color-scheme:dark)").matches;
  const gc=isDark?"#2c2c2a":"#e9ecef",tc=isDark?"#868e96":"#868e96";
  const weeks=c.weeks.map(w=>w.w);
  const vals=c.weeks.map(w=>w[personKpi]);
  const t=thresh(name,weeks[weeks.length-1]);
  const fl=t?t[personKpi][0]:kpi.fl;
  const tg=t?t[personKpi][1]:kpi.tg;
  const datasets=[
    {label:name,data:vals,borderColor:COLORS[name],backgroundColor:COLORS[name]+"20",borderWidth:2.5,pointRadius:4,pointHoverRadius:7,tension:0.3,fill:true,spanGaps:true},
    {label:"Floor",data:weeks.map(()=>fl),borderColor:"#e34948",borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false},
    {label:"Target",data:weeks.map(()=>tg),borderColor:"#0ca30c",borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false},
  ];
  const canvas=document.getElementById("personChart");
  if(!canvas)return;
  personChart=new Chart(canvas,{type:"line",data:{labels:weeks,datasets},options:{
    responsive:true,maintainAspectRatio:false,animation:{duration:400},
    plugins:{legend:{display:false},tooltip:{mode:"index",intersect:false,callbacks:{label:ctx=>ctx.dataset.label+": "+(ctx.parsed.y!==null?kpi.fmt(ctx.parsed.y):"—")}}},
    scales:{x:{ticks:{color:tc,font:{size:10},maxTicksLimit:8},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10},callback:v=>kpi.fmt(v)},grid:{color:gc}}},
  }});
}

window.setPersonKpi=function(k){personKpi=k;if(currentPerson)buildPersonChart(currentPerson);document.querySelectorAll(".kpi-tab").forEach(b=>{b.classList.toggle("on",b.textContent===KPIS[k].label)});};

  }));
  datasets.push({label:"Floor",data:allWeeks.map(()=>kpi.fl),borderColor:"#e34948",borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false});
  datasets.push({label:"Target",data:allWeeks.map(()=>kpi.tg),borderColor:"#0ca30c",borderDash:[6,4],borderWidth:1.5,pointRadius:0,fill:false});
  trendChart=new Chart(document.getElementById("trendC"),{type:"line",data:{labels:allWeeks,datasets},options:{
    responsive:true,maintainAspectRatio:false,animation:{duration:300},
    plugins:{legend:{display:false},tooltip:{mode:"index",intersect:false,callbacks:{label:ctx=>ctx.dataset.label+": "+(ctx.parsed.y!==null?kpi.fmt(ctx.parsed.y):"—")}}},
    scales:{x:{ticks:{color:tc,font:{size:10},maxTicksLimit:8},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10},callback:v=>kpi.fmt(v)},grid:{color:gc}}},
  }});
}
window.setKpi=k=>{trendKpi=k;renderTrends();};

// ── Monthly ───────────────────────────────────────────────────────────────────
function renderMonthly(){
  function mk(w){const d=new Date(w);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
  function ml(k){const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleString("default",{month:"short",year:"2-digit"});}
  const months=[...new Set(allWeeks.map(mk))].sort();
  let html=`<div style="overflow-x:auto"><table class="stats-table"><thead><tr><th>Name</th>`;
  months.forEach(m=>html+=`<th colspan="2" style="text-align:center">${ml(m)}</th>`);
  html+=`</tr><tr><th></th>`;
  months.forEach(()=>html+=`<th style="font-size:9px;color:var(--text3)">CPH</th><th style="font-size:9px;color:var(--text3)">IQS</th>`);
  html+=`</tr></thead><tbody>`;
  Object.keys(C).forEach(name=>{
    const c=C[name];
    html+=`<tr><td style="cursor:pointer;color:var(--blue-t)" onclick="openPerson('${name}','monthly')">${name}</td>`;
    months.forEach(m=>{
      const wks=c.weeks.filter(w=>mk(w.w)===m);
      const avg=k=>{const v=wks.map(w=>w[k]).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b)/v.length:null;};
      const cph=avg("cph"),iqs=avg("iqs");
      const t=wks.length?thresh(name,wks[wks.length-1].w):null;
      const rc=t?rag(cph,t.cph[0],t.cph[1]):null,ri=t?rag(iqs,t.iqs[0],t.iqs[1]):null;
      html+=`<td><span class="chip ${chipCls(rc)}">${cph!==null?cph.toFixed(2):"—"}</span></td><td><span class="chip ${chipCls(ri)}">${iqs!==null?fmtPct(iqs):"—"}</span></td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById("tab-monthly").innerHTML=html;
}

// ── Notes ─────────────────────────────────────────────────────────────────────
function renderNotes(){
  const avColors={nj:["#ebfbee","#2b8a3e"],pp:["#e7f5ff","#1971c2"],ns:["#fff9db","#e67700"],lv:["#f8f0fc","#862e9c"],end:["var(--surface2)","var(--text3)"]};
  let html="";
  Object.keys(C).forEach(name=>{
    const c=C[name];
    const [bg,col]=avColors[c.av];
    html+=`<div class="notes-person">
      <div class="note-ph" onclick="toggleP('${name}')" style="background:${bg}">
        <div class="av av-${c.av}">${name[0]}</div>
        <div class="note-ph-name" style="color:${col}">${name}</div>
        <div class="note-ph-cat">${c.cat}</div>
        <span id="chev-${name}" style="font-size:14px;color:var(--text3);transition:transform 0.2s">⌄</span>
      </div>
      <div class="note-weeks" id="nw-${name}">`;
    c.weeks.forEach((w,i)=>{
      html+=`<div class="note-week">
        <div class="note-wlabel" onclick="toggleW('${name}',${i})">📅 w/c ${w.w}</div>
        <div class="note-body" id="nb-${name}-${i}">
          <div class="note-obs">${w.obs||""}</div>
          <div class="note-yours">
            <span class="note-yours-lbl">Your notes</span>
            <textarea id="ta-${name}-${i}" placeholder="Add session notes..." onblur="saveN('${name}','${w.w}',this.value)"></textarea>
            <span class="saved-flash" id="sv-${name}-${i}">saved ✓</span>
          </div>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById("tab-notes").innerHTML=html;
  loadNotes();
}
window.toggleP=name=>{
  const el=document.getElementById("nw-"+name);
  const ch=document.getElementById("chev-"+name);
  el.classList.toggle("open");
  if(ch)ch.style.transform=el.classList.contains("open")?"rotate(180deg)":"";
};
window.toggleW=(name,i)=>document.getElementById(`nb-${name}-${i}`).classList.toggle("open");
window.saveN=(name,week,text)=>{
  try{localStorage.setItem(`ct_${name}_${week}`,text);}catch(e){}
  const i=C[name].weeks.findIndex(w=>w.w===week);
  const sv=document.getElementById(`sv-${name}-${i}`);
  if(sv){sv.classList.add("show");setTimeout(()=>sv.classList.remove("show"),1500);}
};
function loadNotes(){
  Object.keys(C).forEach(name=>{
    C[name].weeks.forEach((w,i)=>{
      const ta=document.getElementById(`ta-${name}-${i}`);
      if(!ta)return;
      try{const v=localStorage.getItem(`ct_${name}_${w.w}`);ta.value=v!==null?v:(w.yours||"");}
      catch(e){ta.value=w.yours||"";}
    });
  });
}

// ── Alerts ────────────────────────────────────────────────────────────────────
function renderAlerts(){
  const kpiKeys=["cph","iqs","td","csat","iadh"];
  const kpiNames={cph:"CPH",iqs:"IQS",td:"TD adherence",csat:"CSAT",iadh:"Intercom adh"};
  let html=`<div class="section-intro">Checks last 6 weeks per KPI. 📌 3+ consecutive red · ⚠️ 4–5 weeks · 🚨 6 weeks = PIP territory</div>`;
  Object.keys(C).filter(n=>C[n].active&&C[n].cat!=="Low Volume").forEach(name=>{
    const c=C[name];
    const last6=c.weeks.slice(-6);
    let alerts=[];
    kpiKeys.forEach(kk=>{
      let consec=0,maxc=0;
      last6.forEach(row=>{
        const t=thresh(name,row.w);if(!t)return;
        const r=rag(row[kk],t[kk][0],t[kk][1]);
        if(r==="R"){consec++;maxc=Math.max(maxc,consec);}else if(r!==null){consec=0;}
      });
      if(maxc>=3){
        const level=maxc>=6?"🚨 PIP risk":maxc>=4?"⚠️ Watch closely":"📌 Flag";
        const cls=maxc>=6?"al-r":maxc>=4?"al-a":"al-f";
        alerts.push({kpi:kpiNames[kk],weeks:maxc,level,cls});
      }
    });
    html+=`<div class="alert-block">
      <div class="alert-name" style="cursor:pointer;color:var(--blue-t)" onclick="openPerson('${name}','alerts')">${name} ↗ <span style="font-size:11px;color:var(--text3);font-weight:400">— ${c.cat}</span></div>`;
    if(!alerts.length){
      html+=`<div class="alert-row"><span style="color:var(--green-t)">✓ All clear</span></div>`;
    }else{
      alerts.forEach(a=>{
        html+=`<div class="alert-row">
          <span style="min-width:120px;color:var(--text2)">${a.kpi}</span>
          <span style="min-width:70px;color:var(--text3)">${a.weeks} wks</span>
          <span class="al ${a.cls}">${a.level}</span>
        </div>`;
      });
    }
    html+=`</div>`;
  });
  document.getElementById("tab-alerts").innerHTML=html;
}

// ── Tab nav ───────────────────────────────────────────────────────────────────
function showTab(id,btn){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("on"));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("on"));
  document.getElementById("tab-"+id).classList.add("on");
  btn.classList.add("on");
  if(id==="trends")renderTrends();
  if(id==="people")renderPeople();
}
window.showTab=showTab;

// ── Init ──────────────────────────────────────────────────────────────────────
renderDash();
renderPeople();
renderMonthly();
renderNotes();
renderAlerts();
</script>
